repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--config=backend/pyproject.toml]
        files: ^backend/
      - id: ruff-format
        args: [--config=backend/pyproject.toml]
        files: ^backend/
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv --directory backend run mypy
        language: system
        pass_filenames: false
        files: ^backend/app/.*\.py$
      - id: bandit
        name: bandit
        entry: uv --directory backend run bandit -q -r app
        language: system
        pass_filenames: false
        files: ^backend/app/.*\.py$
