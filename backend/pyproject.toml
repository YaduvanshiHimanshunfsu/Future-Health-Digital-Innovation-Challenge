[project]
name = "samvid-backend"
version = "0.1.0"
description = "Backend for Samvid: inherited disease risk explanation, consent-based sharing and care linkage."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13,<2",
    "asyncpg>=0.30,<1",
    "celery>=5.4,<6",
    "cryptography>=43",
    "fastapi>=0.115,<1",
    "fhir-resources>=8,<9",
    "httpx>=0.27,<1",
    "packaging>=24",
    "pgvector>=0.3,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "pyjwt[crypto]>=2.9,<3",
    "pyyaml>=6.0.2,<7",
    "redis>=5.0,<7",
    "sqlalchemy[asyncio]>=2.0.32,<2.1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
# Cross-institution matching only. The package ships no Windows wheels, so it stays out of the
# default install and is only pulled into Linux images that need it.
psi = ["openmined.psi>=2.0.6,<3; sys_platform != 'win32'"]

[dependency-groups]
dev = [
    "bandit>=1.7.9",
    "hypothesis>=6.100",
    "mypy>=1.11",
    "pip-audit>=2.7",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
    "testcontainers[postgres]>=4.7",
    "types-pyyaml>=6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP", "ASYNC", "C4", "RET", "SIM", "PTH", "T20"]
ignore = [
    "B008", # FastAPI's Depends() in default arguments is the framework's documented pattern
    "E501", # the formatter handles code width
]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101", # asserts are how tests work
    "S105", # fixtures hold throwaway credentials
    "S106",
    "S311",
    "S608", # tests build tamper statements from values they generated themselves
    "S603",
    "S607",
    "T20",
]
"app/ops/**" = ["T20"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]

[[tool.mypy.overrides]]
module = ["celery.*", "pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "db: needs a real Postgres (started through testcontainers)",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.bandit]
exclude_dirs = ["tests", "alembic"]
